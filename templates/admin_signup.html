{% extends "base.html" %}

{% block title %}دروستکردنی هەژماری بەڕێوبەر | NEXORA{% endblock %}

{% block content %}
<section class="container section">

    <div class="admin-card">
        <h2 data-i18n="admin.signup_title">✨ دروستکردنی هەژماری بەڕێوبەر</h2>

        {% if error %}
        <div style="background:rgba(239,68,68,0.15); border:1px solid var(--danger); color:var(--danger); padding:10px 14px; border-radius:var(--radius-sm); margin-bottom:18px; text-align:center; font-size:0.9rem;">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" class="admin-form">
            <div class="form-group">
                <label data-i18n="admin.username">ناوی بەکارهێنەر</label>
                <input type="text" name="username" required autofocus placeholder="ناوی بەکارهێنەر">
            </div>

            <div class="form-group">
                <label data-i18n="admin.password">وشەی نهێنی</label>
                <input type="password" name="password" required placeholder="لانیکەم ٦ پیت">
            </div>

            <button type="submit" class="btn-submit" data-i18n="admin.signup_btn">تۆمارکردن</button>
        </form>

        <div class="admin-footer-links">
            <span data-i18n="admin.have_account">هەژمارت هەیە؟</span>
            <a href="{{ url_for('admin_login') }}" data-i18n="admin.login_title">بچۆ ژوورەوە</a>
        </div>
    </div>

</section>
{% endblock %}
