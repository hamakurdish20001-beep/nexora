<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA — سێرڤەر لە کار کەوتووە</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, -apple-system, sans-serif;
        }

        body {
            background: #f59e0b;
            color: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .offline-card {
            background: rgba(255, 255, 255, 0.28);
            border: 2px solid rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 48px 36px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .offline-icon-wrap {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            margin-bottom: 4px;
        }

        .offline-icon-wrap svg {
            width: 44px;
            height: 44px;
            fill: #f59e0b;
        }

        .brand-title {
            font-size: 2.4rem;
            font-weight: 900;
            color: #000000;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .status-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #000000;
        }

        .status-desc {
            font-size: 1.05rem;
            font-weight: 600;
            color: #000000;
            line-height: 1.7;
        }

        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #000000;
            color: #ffffff;
            border: none;
            padding: 14px 38px;
            border-radius: 9999px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
            transition: all 0.25s ease;
            margin-top: 10px;
            text-decoration: none;
        }

        .btn-retry:hover {
            transform: scale(1.06);
            background: #18181b;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
            color: #ffffff;
        }

        .btn-retry:active {
            transform: scale(0.96);
        }

        .server-hint {
            font-size: 0.88rem;
            font-weight: 700;
            color: #000000;
            opacity: 0.85;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon-wrap">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>
        </div>
        <div class="brand-title">NEXORA</div>
        <div class="status-title">سێرڤەر لە کار کەوتووە / You are offline</div>
        <p class="status-desc">
            سێرڤەری پڕۆژەکە داخراوە یان پەیوەندی هێڵت پچڕاوە. تکایە دڵنیابەرەوە لەوەی سێرڤەرەکە کار دەکات و دووبارە هەوڵبدەوە.
        </p>
        <button type="button" class="btn-retry" onclick="window.location.reload()">
            <span>🔄</span>
            <span>دووبارە هەوڵبدەوە / Try again</span>
        </button>
        <div class="server-hint">بۆ هەڵکردنی سێرڤەر لە تێرمیناڵ بنووسە: <strong>python app.py</strong></div>
    </div>
</body>
</html>
